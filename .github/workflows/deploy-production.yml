name: Deploy Pinplot to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 0 — Lint: reject dangerous commands
  # ─────────────────────────────────────────────────────────────────
  lint-workflow:
    name: Lint — no dangerous commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject dangerous Docker commands
        run: |
          # Matches cache-wiping Docker commands via regex pattern (builder|system)+prune
          if grep -rEn "docker (builder|system) prune" .github/workflows/; then
            echo "❌ Dangerous command found in workflow files. Remove it before merging."
            exit 1
          fi
          echo "✅ No dangerous commands found"

  # ─────────────────────────────────────────────────────────────────
  # JOB 1 — Test Backend
  # ─────────────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-workflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd gps-tracker/backend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          cd gps-tracker/backend
          pytest tests/ -v --tb=short
        continue-on-error: false

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 — Build Flutter Web
  # ─────────────────────────────────────────────────────────────────
  build-flutter:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          cd gps-tracker/mobile-app/ble_tracker_app
          flutter pub get
          flutter build web --release --no-tree-shake-icons
          echo "✅ Flutter build complete"
          ls -lh build/web/main.dart.js

      - name: Upload Flutter build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: gps-tracker/mobile-app/ble_tracker_app/build/web/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to Production
  # ─────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-flutter
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download Flutter build
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: gps-tracker/mobile-app/ble_tracker_app/build/web/

      - name: Verify Flutter artifacts
        run: |
          if [ ! -f "gps-tracker/mobile-app/ble_tracker_app/build/web/main.dart.js" ]; then
            echo "❌ Flutter build artifacts missing"
            exit 1
          fi
          echo "✅ Flutter artifacts ready"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Try keyscan first; fall back to StrictHostKeyChecking=no if unreachable
          ssh-keyscan -t rsa,ecdsa,ed25519 -H ${{ secrets.DO_SERVER_IP }} >> ~/.ssh/known_hosts 2>&1 || true
          # Ensure SSH never fails on host key mismatch for this server
          printf 'Host %s\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' "${{ secrets.DO_SERVER_IP }}" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      # ── Sync code (includes pre-built Flutter artifacts) ─────────
      # NOTE: .env files are managed manually on the server and are NEVER
      # written or overwritten by this pipeline. rsync excludes them below.
      - name: Sync code to server
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          # Strip any accidental whitespace/CR from secret values
          SERVER=$(echo "$DO_SERVER_IP" | tr -d '[:space:]')
          USER=$(echo "$DO_USER" | tr -d '[:space:]')

          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.dart_tool' \
            --exclude 'pinplot_postgres_data' \
            --exclude 'backend/.env' \
            --exclude '.env' \
            ./gps-tracker/ "${USER}@${SERVER}:/root/pinplot/gps-tracker/"

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${SERVER}" \
            'test -f /root/pinplot/gps-tracker/mobile-app/ble_tracker_app/build/web/main.dart.js \
             && echo "✅ Flutter artifacts on server" \
             || (echo "❌ Flutter artifacts missing on server" && exit 1)'

      # ── Build and deploy containers ───────────────────────────────
      - name: Deploy containers
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh $DO_USER@$DO_SERVER_IP 'bash -s' << 'SSHEOF'
            set -e
            cd ~/pinplot/gps-tracker

            echo "━━━ Stopping containers ━━━"
            docker compose down --remove-orphans || true

            echo "━━━ Pre-build disk cleanup ━━━"
            docker container prune -f
            # Remove ALL unused images (not just dangling) to reclaim space before building
            docker image prune -a -f
            df -h / | awk 'NR==2{print "  Disk: "$3"/"$2" ("$5" used)"}'

            echo "━━━ Building UI services ━━━"
            docker compose build flutter-web admin-portal

            echo "━━━ Building backend services ━━━"
            docker compose build backend customer

            echo "━━━ Starting all containers ━━━"
            docker compose up -d
            docker compose up -d --force-recreate backend

            echo "━━━ Container status ━━━"
            docker compose ps
          SSHEOF

      # ── Wait for DB and run migrations ────────────────────────────
      - name: Run database migrations
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh $DO_USER@$DO_SERVER_IP 'bash -s' << 'SSHEOF'
            set -e
            cd ~/pinplot/gps-tracker

            echo "⏳ Waiting for database..."
            for i in $(seq 1 30); do
              if docker exec pinplot_db pg_isready -U pinplot_db_user >/dev/null 2>&1; then
                echo "✅ Database ready"
                break
              fi
              echo "  ↻ attempt $i/30"
              sleep 3
            done

            echo "⏳ Waiting for backend..."
            for i in $(seq 1 20); do
              if docker ps --filter name=pinplot_backend \
                  --format '{{.Status}}' | grep -q 'Up'; then
                echo "✅ Backend running"
                break
              fi
              echo "  ↻ attempt $i/20"
              sleep 3
            done

            echo "🔄 Running Alembic migrations..."
            docker compose exec -T backend alembic upgrade head && \
              echo "✅ Migrations complete" || {
              echo "⚠️  Retrying in 15s..."
              sleep 15
              docker compose exec -T backend alembic upgrade head || {
                echo "❌ Migration failed"
                docker logs --tail 30 pinplot_backend
                exit 1
              }
            }
          SSHEOF

      # ── Install / refresh daily cleanup cron job ─────────────────
      - name: Install daily Docker cleanup cron
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          SERVER=$(echo "$DO_SERVER_IP" | tr -d '[:space:]')
          USER=$(echo "$DO_USER" | tr -d '[:space:]')

          # Upload the cleanup script from the checked-out repo
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deploy/docker-daily-cleanup.sh \
            "${USER}@${SERVER}:/usr/local/bin/docker-daily-cleanup.sh"

          # Make executable and register as a cron job (03:00 daily)
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${SERVER}" \
            'chmod +x /usr/local/bin/docker-daily-cleanup.sh && \
             printf "0 3 * * * root /usr/local/bin/docker-daily-cleanup.sh\n" \
               > /etc/cron.d/docker-cleanup && \
             chmod 0644 /etc/cron.d/docker-cleanup && \
             echo "✅ Cron job installed: 03:00 daily → /usr/local/bin/docker-daily-cleanup.sh"'

      # ── Health checks ─────────────────────────────────────────────
      - name: Health checks
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          check() {
            local NAME="$1" URL="$2" RETRIES="${3:-10}"
            for i in $(seq 1 $RETRIES); do
              if curl -fsS --max-time 5 "$URL" >/dev/null 2>&1; then
                echo "✅ $NAME healthy"
                return 0
              fi
              echo "  ↻ $NAME not ready ($i/$RETRIES)..."
              sleep 5
            done
            echo "❌ $NAME FAILED"
            return 1
          }

          FAILED=0
          check "Backend"      "http://$DO_SERVER_IP:8001/api/health" || FAILED=1
          check "Admin Portal" "http://$DO_SERVER_IP:3010"            || FAILED=1
          check "Flutter Web"  "http://$DO_SERVER_IP:3012"            || FAILED=1
          check "Customer UI"  "http://$DO_SERVER_IP:3011"            || FAILED=1

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Health checks failed — collecting logs..."
            ssh $DO_USER@$DO_SERVER_IP \
              'cd ~/pinplot/gps-tracker && \
               docker compose ps && \
               docker logs --tail 30 pinplot_backend'
            echo ""
            echo "🔁 AUTO-ROLLBACK: redeploying previous image..."
            ssh $DO_USER@$DO_SERVER_IP \
              'cd ~/pinplot/gps-tracker && \
               docker compose up -d --force-recreate && \
               sleep 8 && \
               docker compose ps'
            echo "⚠️  Rollback attempted. Marking deployment as FAILED."
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "========================================"
          echo "🚀 Pinplot — Deploy Complete"
          echo "Commit : $(git rev-parse --short HEAD)"
          echo "Branch : ${GITHUB_REF##*/}"
          echo "========================================"
          echo "Backend API : http://${{ secrets.DO_SERVER_IP }}:8001"
          echo "Admin Portal: http://${{ secrets.DO_SERVER_IP }}:3010"
          echo "Flutter Web : http://${{ secrets.DO_SERVER_IP }}:3012"
          echo "Customer UI : http://${{ secrets.DO_SERVER_IP }}:3011"
          echo "========================================"
