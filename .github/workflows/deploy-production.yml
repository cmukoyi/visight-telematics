name: Deploy to Production

# ─────────────────────────────────────────────────────────────────────────────
# Unified multi-tenant production deployment (Phase 4)
# ─────────────────────────────────────────────────────────────────────────────
# One workflow ships any tenant. The tenant is selected by the branch:
#
#   main         → tenant=pinplot → environment=production         → /root/pinplot
#   prod/beacon  → tenant=beacon  → environment=production-beacon  → /root/beacon-telematics
#
# Per-tenant values (server path, display name, db user, container prefix,
# postgres volume name) come from tenants/<tenant>/tenant.env, NOT from
# inline YAML. Adding a third tenant requires:
#   1. tenants/<slug>/tenant.env  (with SERVER_DIR + DISPLAY_NAME)
#   2. add the branch to the on:push triggers
#   3. extend the TENANT / environment / concurrency expressions
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - prod/beacon
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

# Per-tenant concurrency: pinplot and beacon deploys never block each other.
concurrency:
  group: deploy-${{ github.ref_name == 'prod/beacon' && 'beacon' || 'pinplot' }}
  cancel-in-progress: false

# Workflow-level TENANT — derived from branch, available to ALL jobs.
env:
  TENANT: ${{ github.ref_name == 'prod/beacon' && 'beacon' || 'pinplot' }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 0 — Lint: reject dangerous commands + tenant brand drift
  # ─────────────────────────────────────────────────────────────────
  lint-workflow:
    name: Lint — workflow + tenant drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject dangerous Docker commands
        run: |
          # Matches cache-wiping Docker commands via regex pattern (builder|system)+prune
          if grep -rEn "docker (builder|system) prune" .github/workflows/; then
            echo "❌ Dangerous command found in workflow files. Remove it before merging."
            exit 1
          fi
          echo "✅ No dangerous commands found"

      - name: Tenant overlay destinations must be gitignored
        run: |
          # Every destination in scripts/build.sh MAP must be gitignored so
          # the file only exists after `bash scripts/build.sh <tenant>` runs.
          # If a destination is git-tracked, the "default" tenant's content
          # ships to every other tenant unless the overlay overwrites it —
          # a silent source of brand drift.
          set -e
          mapfile -t DESTS < <(
            sed -n '/^MAP=(/,/^)/p' scripts/build.sh \
              | grep -oE '"[^"]+"' \
              | tr -d '"' \
              | sed 's/.*://'
          )
          violations=0
          for dst in "${DESTS[@]}"; do
            path="gps-tracker/$dst"
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "❌ overlay destination is git-tracked (must be gitignored): $path"
              violations=$((violations+1))
            fi
          done
          if [ $violations -gt 0 ]; then
            echo ""
            echo "Add the offending path(s) to gps-tracker/.gitignore under the"
            echo "'Tenant-overlayed' comment block, then remove from git with:"
            echo "  git rm --cached <path>"
            exit 1
          fi
          echo "✅ All ${#DESTS[@]} overlay destinations correctly gitignored"

      - name: Tenant brand-string drift ratchet
        run: |
          # Block NEW occurrences of tenant-specific brand strings in
          # tracked shared code (i.e., outside tenants/). The current count
          # is grandfathered; any PR that increases it must either move the
          # string to tenants/<slug>/ or bump the ratchet here with a
          # reasoned explanation.
          #
          # Patterns intentionally exclude generic words like "PinPlot" in
          # backend env defaults (which are the env-driven fallback and OK).
          set -e
          PATTERNS='Beacon Telematics|beacontelematics\.co\.uk|0xFF173D64|0xFF1f4f7e|0xFFE3EEF9'

          # Count only in git-tracked files outside tenants/.
          # Excludes:
          #   - tenants/                       — legitimate per-tenant brand content
          #   - features_dev/                  — tenant-branded source files (copied to tenants/)
          #   - DEPLOY_RUNBOOK                 — local-only operator doc (gitignored anyway)
          #   - this workflow                  — self-reference; PATTERNS would match itself
          #   - .github/copilot-instructions.md — documents the banned strings as examples
          actual=$(
            git ls-files \
              | grep -v '^tenants/' \
              | grep -v '^features_dev/' \
              | grep -v '^DEPLOY_RUNBOOK\.md$' \
              | grep -v '^\.github/workflows/deploy-production\.yml$' \
              | grep -v '^\.github/copilot-instructions\.md$' \
              | xargs -I{} grep -EnH "$PATTERNS" {} 2>/dev/null \
              | wc -l \
              | tr -d ' '
          )

          # Ratchet — grandfathered count as of phase-4 complete.
          # Known pre-existing tech debt counted here (NOT fixed by this guard):
          #   - backend/app/main.py CORS default hardcoded to beacon
          #   - backend/init_admin.py admin email hardcoded to beacon
          #   - backend/app/admin_logger_service.py BACKEND_URL default
          #   - backend/.env*.example files
          #   - gps-tracker/deploy/*.sh and deploy/*.sh legacy scripts
          #   - mobile-app/ble_tracker_app/web/manifest.json (should join overlay)
          #   - nginx/pinplot.me.conf (misnamed, contains beacon comment)
          # New occurrences are blocked. To resolve any of these properly,
          # move the value to tenants/<slug>/ + scripts/build.sh MAP, or
          # parameterize via env var, then lower this ratchet.
          expected=25

          echo "Tenant brand strings in shared code: actual=$actual, ratchet=$expected"
          if [ "$actual" -gt "$expected" ]; then
            echo ""
            echo "❌ Tenant brand drift increased ($expected → $actual)."
            echo "   New occurrences of beacon-specific strings in shared code:"
            git ls-files \
              | grep -v '^tenants/' \
              | xargs -I{} grep -EnH "$PATTERNS" {} 2>/dev/null \
              | sort
            echo ""
            echo "   Move the strings to tenants/<slug>/ and add the file to"
            echo "   scripts/build.sh MAP + gps-tracker/.gitignore, OR bump the"
            echo "   ratchet in this workflow with a comment explaining why."
            exit 1
          fi
          if [ "$actual" -lt "$expected" ]; then
            echo "ℹ️  Brand drift decreased ($expected → $actual) — please lower the ratchet to $actual."
          fi
          echo "✅ Tenant brand-string ratchet OK"

      - name: No hardcoded secrets / env-fallback literals in backend code
        run: |
          # Blocks two anti-patterns in gps-tracker/backend/**.py:
          #   1. self.<...password|...secret|...token|...api_key> = '<literal>'
          #        — raw credential committed to git (what mzone_service.py
          #          had until phase-4-secrets-fix, eg
          #          self.client_secret = 'g_SkQ.B...').
          #   2. os.getenv('<...>PASSWORD|<...>SECRET|<...>TOKEN|<...>KEY', '<literal>')
          #      os.getenv('<...>PASSWORD|<...>SECRET|<...>TOKEN|<...>KEY') or '<literal>'
          #        — env "fallback" that silently substitutes a literal in
          #          prod when the env var is missing.
          # The secret-keyword must appear at the END of the var name, so
          # MZONE_TOKEN_URL / MZONE_KEY_HOST etc are correctly NOT flagged
          # (they're endpoints, not secrets). For required secrets use
          # os.environ['VAR'] (raises KeyError) or the _required_env() helper.
          # Endpoints/URLs MAY have defaults via os.getenv('VAR_URL', 'https://...').
          set -e
          violations=$(
            git ls-files 'gps-tracker/backend/**/*.py' \
              | grep -v -E '(^|/)(test_|.*_test\.py$|tests/|conftest\.py$)' \
              | xargs -I{} grep -EnH \
                  "(self\.[a-z_]*(password|secret|token|api_?key)\s*=\s*['\"][^'\"$]{4,})|(os\.getenv\(['\"][A-Z_]*(PASSWORD|SECRET|TOKEN|KEY)['\"]\s*,\s*['\"][^'\"]{4,}['\"])|(os\.getenv\(['\"][A-Z_]*(PASSWORD|SECRET|TOKEN|KEY)['\"]\)\s*or\s*['\"][^'\"]{4,}['\"])" \
                  {} 2>/dev/null \
              || true
          )
          if [ -n "$violations" ]; then
            echo "❌ Hardcoded credential or env-fallback literal in backend code:"
            echo "$violations"
            echo ""
            echo "  Replace with: os.environ['VAR_NAME']  (raises KeyError if unset)"
            echo "  or:           _required_env('VAR_NAME')   (clear startup error)"
            echo "  Never use:    os.getenv('X', 'literal')  or  os.getenv('X') or 'literal'"
            echo ""
            echo "  See gps-tracker/backend/app/services/mzone_service.py for the"
            echo "  reference pattern (post phase-4-secrets-fix)."
            exit 1
          fi
          echo "✅ No hardcoded secrets / env-fallback literals in backend code"

  # ─────────────────────────────────────────────────────────────────
  # JOB 1 — Build Flutter Web (per-tenant overlay)
  #
  # NOTE: backend unit tests (tests/test_admin_auth.py) were deliberately
  # removed. They tested PyJWT/hashlib round-trips, not our code, and
  # were green throughout the months-long period when beacon was signing
  # JWTs with the public-git literal 'your-secret-key-change-this'.
  # To be replaced by a post-deploy smoke test that hits the live
  # container's auth endpoint.
  # ─────────────────────────────────────────────────────────────────
  build-flutter:
    name: Build Flutter Web (${{ github.ref_name == 'prod/beacon' && 'beacon' || 'pinplot' }})
    runs-on: ubuntu-latest
    needs: lint-workflow
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Assemble tenant overlay (materializes gitignored Flutter files)
        run: |
          if [ ! -d "tenants/${TENANT}" ]; then
            echo "❌ tenants/${TENANT} not found in repo"
            exit 1
          fi
          bash scripts/build.sh "${TENANT}"
          # Verify the gitignored entrypoint now exists on disk
          test -f gps-tracker/mobile-app/ble_tracker_app/lib/main.dart \
            || { echo "❌ overlay did not produce lib/main.dart"; exit 1; }

      - name: Build Flutter Web
        run: |
          cd gps-tracker/mobile-app/ble_tracker_app
          flutter pub get
          flutter build web --release --no-tree-shake-icons
          echo "✅ Flutter build complete"
          ls -lh build/web/main.dart.js

      - name: Upload Flutter build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: gps-tracker/mobile-app/ble_tracker_app/build/web/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to Production (per-tenant)
  # ─────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy ${{ github.ref_name == 'prod/beacon' && 'Beacon' || 'Pinplot' }} to Production
    runs-on: ubuntu-latest
    needs: build-flutter
    # Per-tenant Environment binds the right reviewers/secrets to the run.
    environment: ${{ github.ref_name == 'prod/beacon' && 'production-beacon' || 'production' }}

    steps:
      - uses: actions/checkout@v4

      # ── Resolve all per-tenant values from tenants/<TENANT>/tenant.env ──
      # Exports to $GITHUB_ENV so subsequent steps can use:
      #   SERVER_DIR, DISPLAY_NAME, TENANT_PREFIX, TENANT_DB_USER,
      #   PG_VOLUME, DB_CONTAINER, BACKEND_CONTAINER
      # No tenant-specific values are inlined in YAML below — single source
      # of truth is tenants/<slug>/tenant.env.
      - name: Load tenant config
        run: |
          set -euo pipefail
          TENANT_ENV="tenants/${TENANT}/tenant.env"
          if [ ! -f "$TENANT_ENV" ]; then
            echo "❌ $TENANT_ENV missing"
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          . "$TENANT_ENV"
          set +a
          : "${TENANT_PREFIX:?tenant.env must define TENANT_PREFIX}"
          : "${TENANT_DB_USER:?tenant.env must define TENANT_DB_USER}"
          : "${SERVER_DIR:?tenant.env must define SERVER_DIR}"
          : "${DISPLAY_NAME:?tenant.env must define DISPLAY_NAME}"
          {
            echo "TENANT_PREFIX=$TENANT_PREFIX"
            echo "TENANT_DB_USER=$TENANT_DB_USER"
            echo "SERVER_DIR=$SERVER_DIR"
            echo "DISPLAY_NAME=$DISPLAY_NAME"
            echo "PG_VOLUME=${TENANT_PREFIX}_postgres_data"
            echo "DB_CONTAINER=${TENANT_PREFIX}_db"
            echo "BACKEND_CONTAINER=${TENANT_PREFIX}_backend"
          } >> "$GITHUB_ENV"
          echo "✅ Tenant config loaded:"
          echo "   TENANT             = $TENANT"
          echo "   DISPLAY_NAME       = $DISPLAY_NAME"
          echo "   SERVER_DIR         = $SERVER_DIR"
          echo "   TENANT_PREFIX      = $TENANT_PREFIX"
          echo "   PG_VOLUME (excl.)  = ${TENANT_PREFIX}_postgres_data"
          echo "   DB_CONTAINER       = ${TENANT_PREFIX}_db"
          echo "   BACKEND_CONTAINER  = ${TENANT_PREFIX}_backend"

      - name: Download Flutter build
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: gps-tracker/mobile-app/ble_tracker_app/build/web/

      - name: Verify Flutter artifacts
        run: |
          if [ ! -f "gps-tracker/mobile-app/ble_tracker_app/build/web/main.dart.js" ]; then
            echo "❌ Flutter build artifacts missing"
            exit 1
          fi
          echo "✅ Flutter artifacts ready"

      # ── Assemble per-tenant overlay into gps-tracker/ ────────────
      - name: Assemble tenant overlay
        run: |
          if [ ! -d "tenants/${TENANT}" ]; then
            echo "❌ tenants/${TENANT} not found in repo"
            exit 1
          fi
          bash scripts/build.sh "${TENANT}"

      - name: Verify tenant overlay
        run: |
          # Marker exists and matches expected tenant
          if [ ! -f "gps-tracker/.tenant" ] || ! grep -qx "${TENANT}" gps-tracker/.tenant; then
            echo "❌ tenant marker missing or mismatched (expected ${TENANT})"
            exit 1
          fi
          # Critical assets present after assembly (fail loud, not at runtime)
          required=(
            "gps-tracker/admin-portal/assets/logo.png"
            "gps-tracker/customer-dashboard/public/assets/logo.png"
            "gps-tracker/nginx/nginx.conf"
            "gps-tracker/mobile-app/ble_tracker_app/web/favicon.ico"
            "gps-tracker/docker-compose.yml"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ missing after overlay: $f"
              missing=1
            fi
          done
          # Compose template must have rendered cleanly — no placeholders left
          if grep -q "__TENANT_" gps-tracker/docker-compose.yml 2>/dev/null; then
            echo "❌ unsubstituted placeholders in gps-tracker/docker-compose.yml"
            grep -n "__TENANT_" gps-tracker/docker-compose.yml
            missing=1
          fi
          [ $missing -eq 0 ] && echo "✅ tenant overlay verified: ${TENANT}"
          exit $missing

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Try keyscan first; fall back to StrictHostKeyChecking=no if unreachable
          ssh-keyscan -t rsa,ecdsa,ed25519 -H ${{ secrets.DO_SERVER_IP }} >> ~/.ssh/known_hosts 2>&1 || true
          # Ensure SSH never fails on host key mismatch for this server
          printf 'Host %s\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' "${{ secrets.DO_SERVER_IP }}" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      # ─────────────────────────────────────────────────────────────
      # .env PROTECTION — three independent guards, fail loud:
      #   1. Pre-rsync snapshot: sha256 every .env* file on the server
      #   2. rsync excludes: every .env / *.env / .env.* pattern
      #   3. Post-rsync verification: re-hash, fail if any drifted/missing
      # .env files are managed manually on the server and MUST never be
      # written, overwritten, or deleted by this pipeline.
      # ─────────────────────────────────────────────────────────────
      - name: Snapshot server .env files (pre-rsync)
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          SERVER=$(echo "$DO_SERVER_IP" | tr -d '[:space:]')
          USER=$(echo "$DO_USER" | tr -d '[:space:]')
          mkdir -p .env-snapshot
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${SERVER}" \
            "cd '${SERVER_DIR}/gps-tracker' && \
             find . -type f \( -name '.env' -o -name '*.env' -o -name '.env.*' \) \
               -not -path '*/node_modules/*' \
               -not -path '*/.git/*' \
               -print0 2>/dev/null | xargs -0 -r sha256sum 2>/dev/null | sort" \
            > .env-snapshot/before.txt
          echo "── .env files on server BEFORE rsync ──"
          cat .env-snapshot/before.txt || echo "(none)"
          echo "── end snapshot ──"

      - name: Sync code to server
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          # Strip any accidental whitespace/CR from secret values
          SERVER=$(echo "$DO_SERVER_IP" | tr -d '[:space:]')
          USER=$(echo "$DO_USER" | tr -d '[:space:]')

          # Hardened .env excludes — covers .env, .env.local, .env.production,
          # .env.example, anything matching *.env, in any subdirectory.
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.dart_tool' \
            --exclude "${PG_VOLUME}" \
            --exclude '.env' \
            --exclude '*.env' \
            --exclude '.env.*' \
            --filter='protect .env' \
            --filter='protect *.env' \
            --filter='protect .env.*' \
            ./gps-tracker/ "${USER}@${SERVER}:${SERVER_DIR}/gps-tracker/"

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${SERVER}" \
            "test -f ${SERVER_DIR}/gps-tracker/mobile-app/ble_tracker_app/build/web/main.dart.js \
             && echo '✅ Flutter artifacts on server' \
             || (echo '❌ Flutter artifacts missing on server' && exit 1)"

      - name: Verify .env files unchanged (post-rsync)
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          SERVER=$(echo "$DO_SERVER_IP" | tr -d '[:space:]')
          USER=$(echo "$DO_USER" | tr -d '[:space:]')
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${SERVER}" \
            "cd '${SERVER_DIR}/gps-tracker' && \
             find . -type f \( -name '.env' -o -name '*.env' -o -name '.env.*' \) \
               -not -path '*/node_modules/*' \
               -not -path '*/.git/*' \
               -print0 2>/dev/null | xargs -0 -r sha256sum 2>/dev/null | sort" \
            > .env-snapshot/after.txt
          echo "── .env files on server AFTER rsync ──"
          cat .env-snapshot/after.txt || echo "(none)"
          if ! diff -u .env-snapshot/before.txt .env-snapshot/after.txt; then
            echo ""
            echo "❌ FATAL: .env file(s) changed during rsync!"
            echo "   Deploy is ABORTED. Investigate immediately."
            echo "   The rsync excludes did NOT protect these files."
            exit 1
          fi
          echo "✅ All .env files identical before and after rsync"

      - name: Verify Alembic migration chain on server (fail fast)
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          SERVER=$(echo "$DO_SERVER_IP" | tr -d '[:space:]')
          USER=$(echo "$DO_USER" | tr -d '[:space:]')
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${SERVER}" \
            "set -e; cd '${SERVER_DIR}/gps-tracker'; \
             test -f backend/alembic/versions/046_critical_alert_subscriptions.py; \
             test -f backend/alembic/versions/047_hive_outlier_audit_fields.py; \
             grep -q \"^revision = '046_critical_alert_subs'\" backend/alembic/versions/046_critical_alert_subscriptions.py; \
             grep -q \"^down_revision = '046_critical_alert_subs'\" backend/alembic/versions/047_hive_outlier_audit_fields.py; \
             echo '✅ Alembic chain check passed (046 -> 047)'; \
             ls -l backend/alembic/versions/046_critical_alert_subscriptions.py backend/alembic/versions/047_hive_outlier_audit_fields.py"

      # ── Build and deploy containers ───────────────────────────────
      - name: Deploy containers
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          # Pass tenant-specific server path through to remote shell
          ssh "$DO_USER@$DO_SERVER_IP" \
              "SERVER_DIR='${SERVER_DIR}' bash -s" << 'SSHEOF'
            set -e
            cd "${SERVER_DIR}/gps-tracker"

            echo "━━━ Pre-build disk cleanup (containers only) ━━━"
            docker container prune -f
            df -h / | awk 'NR==2{print "  Disk: "$3"/"$2" ("$5" used)"}'

            echo "━━━ Building UI services ━━━"
            docker compose build flutter-web admin-portal

            echo "━━━ Building backend services ━━━"
            docker compose build backend customer

            echo "━━━ Stopping old containers ━━━"
            docker compose down --remove-orphans || true

            echo "━━━ Cleanup dangling images only (preserves base images) ━━━"
            # Only remove dangling/untagged images (NO -a flag!)
            # Keeps nginx, postgres, mosquitto, pareto-anywhere cached locally
            docker image prune -f

            echo "━━━ Starting all containers ━━━"
            # --pull missing: only pull if image doesn't exist locally
            # Won't check Docker Hub for updates if image is cached
            docker compose up -d --pull missing

            echo "━━━ Container status ━━━"
            docker compose ps
          SSHEOF

      # ── Wait for DB and run migrations ────────────────────────────
      - name: Run database migrations
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_SERVER_IP" \
              "SERVER_DIR='${SERVER_DIR}' \
               DB_CONTAINER='${DB_CONTAINER}' \
               BACKEND_CONTAINER='${BACKEND_CONTAINER}' \
               TENANT_DB_USER='${TENANT_DB_USER}' \
               bash -s" << 'SSHEOF'
            set -e
            cd "${SERVER_DIR}/gps-tracker"

            echo "⏳ Waiting for database (${DB_CONTAINER})..."
            for i in $(seq 1 30); do
              if docker exec "${DB_CONTAINER}" pg_isready -U "${TENANT_DB_USER}" >/dev/null 2>&1; then
                echo "✅ Database ready"
                break
              fi
              echo "  ↻ attempt $i/30"
              sleep 3
            done

            echo "⏳ Waiting for backend (${BACKEND_CONTAINER})..."
            for i in $(seq 1 20); do
              if docker ps --filter "name=${BACKEND_CONTAINER}" \
                  --format '{{.Status}}' | grep -q 'Up'; then
                echo "✅ Backend running"
                break
              fi
              echo "  ↻ attempt $i/20"
              sleep 3
            done

            echo "🔄 Running Alembic migrations..."
            docker compose exec -T backend alembic upgrade head && \
              echo "✅ Migrations complete" || {
              echo "⚠️  Retrying in 15s..."
              sleep 15
              docker compose exec -T backend alembic upgrade head || {
                echo "❌ Migration failed"
                docker logs --tail 30 "${BACKEND_CONTAINER}"
                exit 1
              }
            }
          SSHEOF

      # ── Install / refresh daily cleanup cron job ─────────────────
      - name: Install daily Docker cleanup cron
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          SERVER=$(echo "$DO_SERVER_IP" | tr -d '[:space:]')
          USER=$(echo "$DO_USER" | tr -d '[:space:]')

          # Upload the cleanup script from the checked-out repo
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deploy/docker-daily-cleanup.sh \
            "${USER}@${SERVER}:/usr/local/bin/docker-daily-cleanup.sh"

          # Make executable and register as a cron job (03:00 daily).
          # Same script handles both tenants — it operates on Docker globally.
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${SERVER}" \
            'chmod +x /usr/local/bin/docker-daily-cleanup.sh && \
             printf "0 3 * * * root /usr/local/bin/docker-daily-cleanup.sh\n" \
               > /etc/cron.d/docker-cleanup && \
             chmod 0644 /etc/cron.d/docker-cleanup && \
             echo "✅ Cron job installed: 03:00 daily → /usr/local/bin/docker-daily-cleanup.sh"'

      # ── Health checks ─────────────────────────────────────────────
      - name: Health checks
        env:
          DO_SERVER_IP: ${{ secrets.DO_SERVER_IP }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          check() {
            local NAME="$1" URL="$2" RETRIES="${3:-10}"
            for i in $(seq 1 $RETRIES); do
              if curl -fsS --max-time 5 "$URL" >/dev/null 2>&1; then
                echo "✅ $NAME healthy"
                return 0
              fi
              echo "  ↻ $NAME not ready ($i/$RETRIES)..."
              sleep 5
            done
            echo "❌ $NAME FAILED"
            return 1
          }

          FAILED=0
          check "Backend"      "http://$DO_SERVER_IP:8001/api/health" || FAILED=1
          check "Admin Portal" "http://$DO_SERVER_IP:3010"            || FAILED=1
          check "Flutter Web"  "http://$DO_SERVER_IP:3012"            || FAILED=1
          check "Customer UI"  "http://$DO_SERVER_IP:3011"            || FAILED=1

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Health checks failed — collecting logs..."
            ssh "$DO_USER@$DO_SERVER_IP" \
              "cd ${SERVER_DIR}/gps-tracker && \
               docker compose ps && \
               docker logs --tail 30 ${BACKEND_CONTAINER}"
            echo ""
            echo "🔁 AUTO-ROLLBACK: redeploying previous image..."
            ssh "$DO_USER@$DO_SERVER_IP" \
              "cd ${SERVER_DIR}/gps-tracker && \
               docker compose up -d --pull missing --force-recreate && \
               sleep 8 && \
               docker compose ps"
            echo "⚠️  Rollback attempted. Marking deployment as FAILED."
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "========================================"
          echo "🚀 ${DISPLAY_NAME} — Deploy Complete"
          echo "Tenant : ${TENANT}"
          echo "Commit : $(git rev-parse --short HEAD)"
          echo "Branch : ${GITHUB_REF##*/}"
          echo "========================================"
          echo "Backend API : http://${{ secrets.DO_SERVER_IP }}:8001"
          echo "Admin Portal: http://${{ secrets.DO_SERVER_IP }}:3010"
          echo "Flutter Web : http://${{ secrets.DO_SERVER_IP }}:3012"
          echo "Customer UI : http://${{ secrets.DO_SERVER_IP }}:3011"
          echo "========================================"
