name: Mobile App — Android APK

# ─────────────────────────────────────────────────────────────────────────────
# Builds the Flutter app (gps-tracker/mobile-app/visight_app) and attaches the
# APK to the run as a downloadable artifact (Actions → this run → Artifacts).
#
# Runs only when the app itself changes, on any branch, so server-only pushes
# never wait on (or pay for) a Flutter build. Run it by hand with
# "Run workflow" to rebuild without a change.
#
# Signing: with the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets set, the APK is signed
# with the upload key, so each new APK installs over the last one. Without
# them it is signed with a throwaway debug key (uninstall before installing).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    paths:
      - 'gps-tracker/mobile-app/visight_app/**'
      - '!gps-tracker/mobile-app/visight_app/**/*.md'
      - '.github/workflows/mobile-app.yml'
  pull_request:
    paths:
      - 'gps-tracker/mobile-app/visight_app/**'
      - '!gps-tracker/mobile-app/visight_app/**/*.md'
      - '.github/workflows/mobile-app.yml'
  workflow_dispatch:

# A newer push to the same branch supersedes a build still running.
concurrency:
  group: mobile-app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.2'
  APP_DIR: gps-tracker/mobile-app/visight_app

jobs:
  android:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ${{ env.APP_DIR }}/android/*.gradle*
            ${{ env.APP_DIR }}/android/app/*.gradle*
            ${{ env.APP_DIR }}/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the APK is signed with a debug key and won't install over a previous build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        # The run number is the versionCode, so every build installs as an update.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          name="visight-track-${version}-${{ github.run_number }}-${GITHUB_SHA::7}"
          mv build/app/outputs/flutter-apk/app-release.apk "build/${name}.apk"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          {
            echo "### 📱 ${name}.apk"
            echo "Version ${version} (build ${{ github.run_number }}) from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
            echo "Download it from **Artifacts** below; kept for 30 days."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ env.APP_DIR }}/build/${{ steps.apk.outputs.name }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
