<!DOCTYPE html>
<html>
<head>
  <title>Button Visibility Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #00ff00; }
    .test { margin: 10px 0; padding: 10px; background: #2a2a2a; border-left: 4px solid #00ff00; }
    .fail { border-color: #ff0000; color: #ff6666; }
    .pass { border-color: #00ff00; color: #00ff00; }
    button { background: #00ff00; color: #000; border: none; padding: 10px 20px; margin: 10px 0; cursor: pointer; }
    button:hover { background: #00cc00; }
  </style>
</head>
<body>
  <h1>🔍 Floor Plan Buttons Diagnostic</h1>
  <div id="results"></div>
  <button onclick="runTests()">Run Tests</button>
  <button onclick="forceVisible()">Force Everything Visible</button>
  <button onclick="switchToSketch()">Switch to Floor Plan Sketch Tab</button>
  
  <script>
    function log(message, pass) {
      const div = document.createElement('div');
      div.className = 'test ' + (pass ? 'pass' : 'fail');
      div.innerHTML = (pass ? '✅ ' : '❌ ') + message;
      document.getElementById('results').appendChild(div);
    }
    
    function runTests() {
      document.getElementById('results').innerHTML = '<h2>Test Results:</h2>';
      
      // Test 1: Building tab exists
      const tabBuilding = window.parent.document.getElementById('tab-building');
      log('Tab #tab-building exists', !!tabBuilding);
      
      if (!tabBuilding) {
        log('CRITICAL: Cannot find Floor Plan Sketch tab!', false);
        return;
      }
      
      // Test 2: Building tab is visible      const tabVisible = window.getComputedStyle(tabBuilding).display !== 'none';
      log('Tab is visible (display !== none)', tabVisible);
      if (!tabVisible) log('⚠️ You need to click "Floor Plan Sketch (Beta)" in the sidebar!', false);
      
      // Test 3: sketch-root exists
      const sketchRoot = window.parent.document.getElementById('sketch-root');
      log('sketch-root exists', !!sketchRoot);
      
      // Test 4: sk-header exists
      const header = window.parent.document.querySelector('#sketch-root .sk-header');
      log('sk-header exists', !!header);
      
      // Test 5: Setup button exists
      const setupBtn = window.parent.document.getElementById('setupFloorBtn');
      log('setupFloorBtn exists', !!setupBtn);
      
      // Test 6: Setup button visible
      if (setupBtn) {
        const setupVisible = setupBtn.offsetParent !== null;
        const setupStyle = window.getComputedStyle(setupBtn);
        log(`Setup button offsetParent !== null`, setupVisible);
        log(`Setup button display: ${setupStyle.display}`, setupStyle.display !== 'none');
        log(`Setup button visibility: ${setupStyle.visibility}`, setupStyle.visibility !== 'hidden');
      }
      
      // Test 7: Publish button exists
      const publishBtn = window.parent.document.getElementById('publishFloorBtn');
      log('publishFloorBtn exists', !!publishBtn);
      
      if (publishBtn) {
        const publishStyle = window.getComputedStyle(publishBtn);
        log(`Publish button display: ${publishStyle.display} (should be none initially)`, true);
      }
      
      // Test 8: CSS loaded
      if (sketchRoot) {
        const rootStyle = window.getComputedStyle(sketchRoot);
        log(`sketch-root display: ${rootStyle.display}`, rootStyle.display !== 'none');
        log(`sketch-root CSS variables loaded: ${rootStyle.getPropertyValue('--primary')}`, !!rootStyle.getPropertyValue('--primary'));
      }
    }
    
    function forceVisible() {
      const doc = window.parent.document;
      
      // Force tab visible
      const tab = doc.getElementById('tab-building');
      if (tab) {
        tab.classList.add('active');
        tab.style.display = 'flex';
        log('✅ Forced tab-building visible', true);
      }
      
      // Force sketch-root visible
      const root = doc.getElementById('sketch-root');
      if (root) {
        root.style.display = 'flex';
        root.style.visibility = 'visible';
        root.style.opacity = '1';
        log('✅ Forced sketch-root visible', true);
      }
      
      // Force header visible
      const header = doc.querySelector('#sketch-root .sk-header');
      if (header) {
        header.style.display = 'flex';
        header.style.visibility = 'visible';
        header.style.opacity = '1';
        log('✅ Forced sk-header visible', true);
      }
      
      // Force buttons visible
      const setupBtn = doc.getElementById('setupFloorBtn');
      if (setupBtn) {
        setupBtn.style.display = 'inline-flex';
        setupBtn.style.visibility = 'visible';
        setupBtn.style.opacity = '1';
        log('✅ Forced setupFloorBtn visible', true);
      }
      
      const publishBtn = doc.getElementById('publishFloorBtn');
      if (publishBtn) {
        publishBtn.style.display = 'inline-flex';
        publishBtn.style.visibility = 'visible';
        publishBtn.style.opacity = '1';
        log('✅ Forced publishFloorBtn visible', true);
      }
      
      // Trigger resize/render
      if (window.parent.resizeCanvases) window.parent.resizeCanvases();
      if (window.parent.render) window.parent.render();
      
      alert('✅ Forced everything visible! Check the Floor Plan Sketch tab now.');
    }
    
    function switchToSketch() {
      if (window.parent.switchTab) {
        window.parent.switchTab('building');
        alert('✅ Switched to Floor Plan Sketch tab!');
        setTimeout(runTests, 500);
      } else {
        alert('❌ switchTab function not found');
      }
    }
    
    // Auto-run on load
    window.addEventListener('load', () => {
      setTimeout(runTests, 1000);
    });
  </script>
</body>
</html>
