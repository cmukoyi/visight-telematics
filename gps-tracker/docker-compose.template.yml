
# Production Docker Compose — TEMPLATE
# Deployed via GitHub Actions CI/CD
# Secrets injected from backend/.env (written by pipeline from GitHub Secrets)
#
# This file is the single source of truth for production compose across all
# tenants. scripts/build.sh substitutes per-tenant values from
# tenants/<tenant>/tenant.env and writes gps-tracker/docker-compose.yml
# (gitignored, build output).
#
# CRITICAL: the tenant prefix is also the docker volume name prefix.
# Renaming a tenant's prefix orphans its postgres data volume. Do NOT
# change a tenant's prefix after first deploy without a planned data
# migration.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: __TENANT_PREFIX___db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-__TENANT_DB_USER__}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-__TENANT_DB_NAME__}
    volumes:
      - __TENANT_PREFIX___postgres_data:/var/lib/postgresql/data
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-__TENANT_DB_USER__} -d ${POSTGRES_DB:-__TENANT_DB_NAME__}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    # Also run by the DataProfiler pipeline services below (built once).
    image: visight-track-backend:latest
    container_name: __TENANT_PREFIX___backend
    env_file:
      - ./backend/.env
    ports:
      - "0.0.0.0:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Keep container health focused on process liveness (listening socket),
      # not transient request latency from background polling bursts.
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close(); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      # Docker socket for container management API (routes_ops.py)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DEBUG=False
      - ENVIRONMENT=production
      # FROM_EMAIL/BRAND_* are loaded from backend/.env — keep tenant-specific
      # values out of the committed compose file.
    # One worker — background housekeeping (offline alerts, package expiry)
    # must not run in multiple processes or alerts would be duplicated.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    container_name: __TENANT_PREFIX___admin
    ports:
      - "3010:80"
    volumes:
      # Shared per-tenant branding dir (same source as the customer portal)
      # so admin/login and customer/login render the same tenant logo. Drop
      # logo.png into ./customer-dashboard/tenant-assets/ on the host; served
      # at /admin/tenant-assets/ via the outer nginx.
      - ./customer-dashboard/tenant-assets:/usr/share/nginx/html/tenant-assets:ro
    depends_on:
      - backend
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  customer:
    build:
      context: ./customer-dashboard
      dockerfile: Dockerfile
    container_name: __TENANT_PREFIX___customer
    ports:
      - "3011:3001"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
      - CUSTOMER_TENANT=__TENANT_PREFIX__
      - NODE_ENV=production
    volumes:
      # Per-tenant branding (logo, favicon, etc.). Bind-mounted read-only so
      # `git pull` never overwrites the tenant's logo and a sister repo sync
      # cannot leak one tenant's assets into another. Drop files into
      # ./customer-dashboard/tenant-assets/ on the host; served by nginx at
      # /customer/tenant-assets/.
      - ./customer-dashboard/tenant-assets:/app/public/tenant-assets:ro
    depends_on:
      - backend
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging

  # ── DataProfiler event pipeline ───────────────────────────────────
  # Enabled per tenant with COMPOSE_PROFILES=dataprofiler (tenants/<t>/tenant.env).
  # Secrets: EVENTS_DB_PASSWORD and RABBITMQ_PASSWORD in backend/.env. The
  # broker and events DB read them from that file too (exported under the
  # names their images expect) so there is a single place to set them.
  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    profiles: ["dataprofiler"]
    container_name: __TENANT_PREFIX___rabbitmq
    hostname: rabbitmq   # node name (and its data dir) must survive container recreation
    env_file:
      - ./backend/.env
    environment:
      RABBITMQ_DEFAULT_USER: dataprofiler
    entrypoint: ["sh", "-c", "export RABBITMQ_DEFAULT_PASS=\"$$RABBITMQ_PASSWORD\"; exec docker-entrypoint.sh rabbitmq-server"]
    volumes:
      - __TENANT_PREFIX___rabbitmq_data:/var/lib/rabbitmq
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  events-db:
    image: postgres:16.4-alpine
    profiles: ["dataprofiler"]
    container_name: __TENANT_PREFIX___events_db
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: dataprofiler
      POSTGRES_DB: dataprofiler_events
    entrypoint: ["sh", "-c", "export POSTGRES_PASSWORD=\"$$EVENTS_DB_PASSWORD\"; exec docker-entrypoint.sh postgres"]
    volumes:
      - __TENANT_PREFIX___events_data:/var/lib/postgresql/data
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataprofiler -d dataprofiler_events"]
      interval: 10s
      timeout: 5s
      retries: 5

  gprs-listener:
    image: visight-track-backend:latest   # built by the backend service
    pull_policy: never
    profiles: ["dataprofiler"]
    container_name: __TENANT_PREFIX___gprs_listener
    env_file:
      - ./backend/.env
    # Skip the backend entrypoint (migrations); the backend runs them and must be healthy first.
    entrypoint: []
    command: python -m app.dataprofiler.listener
    ports:
      - "0.0.0.0:5027:5027"   # Teltonika devices
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      events-db:
        condition: service_healthy
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging

  event-writer:
    image: visight-track-backend:latest   # built by the backend service
    pull_policy: never
    profiles: ["dataprofiler"]
    container_name: __TENANT_PREFIX___event_writer
    env_file:
      - ./backend/.env
    entrypoint: []
    command: python -m app.dataprofiler.writer
    depends_on:
      rabbitmq:
        condition: service_healthy
      events-db:
        condition: service_healthy
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging

  event-decoder:
    image: visight-track-backend:latest   # built by the backend service
    pull_policy: never
    profiles: ["dataprofiler"]
    container_name: __TENANT_PREFIX___event_decoder
    env_file:
      - ./backend/.env
    entrypoint: []
    command: python -m app.dataprofiler.decoder
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      events-db:
        condition: service_healthy
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging

  # Customer-dashboard side: drains each linked Data Exchange queue into the
  # main database (kept permanently). Messages wait in the queue while it's down.
  dashboard-ingest:
    image: visight-track-backend:latest   # built by the backend service
    pull_policy: never
    profiles: ["dataprofiler"]
    container_name: __TENANT_PREFIX___dashboard_ingest
    env_file:
      - ./backend/.env
    entrypoint: []
    command: python -m app.dataprofiler.dashboard_ingest
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:alpine
    container_name: __TENANT_PREFIX___nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - admin-portal
      - customer
    networks:
      - __TENANT_PREFIX___network
    restart: unless-stopped
    logging: *default-logging

volumes:
  __TENANT_PREFIX___postgres_data:
    driver: local
  __TENANT_PREFIX___rabbitmq_data:
    driver: local
  __TENANT_PREFIX___events_data:
    driver: local
  nginx_logs:
    driver: local
networks:
  __TENANT_PREFIX___network:
    name: __TENANT_PREFIX___network   # explicit name prevents docker-compose project prefix
    driver: bridge
